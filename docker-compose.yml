services:
  db:
    image: rate-tracker-database
    container_name: database
    build:
      context: ./db
      dockerfile: Dockerfile
    ports:
      - "5555:5432"

  rabbit:
    image: broker-rabbit-rate-tracker
    container_name: rabbitmq
    build:
      context: ./rabbit
      dockerfile: Dockerfile
    ports:
      - "5672:5672"
      - "15672:15672"

  reddis:
    image: cache-reddis-rate-tracker
    container_name: cahce
    build:
      context: cahce
      dockerfile: Dockerfile
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  redis_data:

